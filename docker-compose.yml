services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: expert-call-ai-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend/vectorstore:/app/vectorstore

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: expert-call-ai-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped